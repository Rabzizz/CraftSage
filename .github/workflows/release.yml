name: Release

on:
  push:
    branches: [main, beta, alpha]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed so we can list all existing tags

      - name: Determine release type from branch
        id: rel
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            echo "type=release"     >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "beta" ]; then
            echo "type=beta"        >> "$GITHUB_OUTPUT"
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "type=alpha"       >> "$GITHUB_OUTPUT"
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
          fi

      - name: Read version and resolve full version
        id: ver
        run: |
          VERSION=$(grep -m1 "^## Version:" CraftSage.toc | sed 's/## Version:[[:space:]]*//')
          BRANCH="${{ github.ref_name }}"

          if [ "$BRANCH" = "main" ]; then
            FULL_VERSION="$VERSION"
          else
            TYPE="${{ steps.rel.outputs.type }}"
            EXISTING=$(git tag | grep -E "^v${VERSION}-${TYPE}\.[0-9]+$" | wc -l | tr -d ' ')
            BUILD=$((EXISTING + 1))
            FULL_VERSION="${VERSION}-${TYPE}.${BUILD}"
          fi

          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: check
        run: |
          if git tag | grep -qx "v${{ steps.ver.outputs.full_version }}"; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        if: steps.check.outputs.exists == 'false'
        run: |
          python3 - <<'PYEOF'
          import re
          version = "${{ steps.ver.outputs.version }}"
          branch  = "${{ github.ref_name }}"
          content = open("CHANGELOG.md").read()

          # alpha/beta: prefer [Unreleased] block, fall back to versioned block
          if branch in ("alpha", "beta"):
              m = re.search(r"(## \[Unreleased\].*?)(?=\n## \[|\Z)", content, re.DOTALL)
              if not m:
                  m = re.search(r"(## \[" + re.escape(version) + r"\].*?)(?=\n## \[|\Z)", content, re.DOTALL)
          else:
              m = re.search(r"(## \[" + re.escape(version) + r"\].*?)(?=\n## \[|\Z)", content, re.DOTALL)

          full_version = "${{ steps.ver.outputs.full_version }}"
          body = m.group(1).strip() if m else f"Release v{full_version}"
          open("release_body.md", "w").write(body)
          PYEOF

      - name: Package addon
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.full_version }}"
          mkdir -p dist/CraftSage

          # Mirror the include list in build-release.ps1
          for item in CraftSage.toc Core.lua UI Data Libs Locale; do
            cp -r "$item" "dist/CraftSage/$item"
          done
          for tga in *.tga; do
            [ -f "$tga" ] && cp "$tga" "dist/CraftSage/$tga"
          done

          cd dist
          zip -r "../v${VERSION}.zip" CraftSage/

      - name: Upload to CurseForge
        if: steps.check.outputs.exists == 'false'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.full_version }}"

          GAME_VERSION_ID=$(curl -sf \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" \
            "https://wow.curseforge.com/api/game/versions" | python3 -c "
          import json, sys
          versions = json.load(sys.stdin)
          matches = [v for v in versions if v.get('name', '').startswith('1.15')]
          if not matches:
              print('ERROR: no 1.15.x versions found. Available (top 20 by id):', file=sys.stderr)
              for v in sorted(versions, key=lambda x: x['id'], reverse=True)[:20]:
                  print(f\"  {v['id']}: {v['name']}\", file=sys.stderr)
              sys.exit(1)
          matches.sort(key=lambda v: v['id'], reverse=True)
          print(matches[0]['id'])
          ")

          echo "Resolved game version ID: $GAME_VERSION_ID"

          jq -n \
            --rawfile changelog release_body.md \
            --arg version "$VERSION" \
            --argjson gv "$GAME_VERSION_ID" \
            --arg reltype "${{ steps.rel.outputs.type }}" \
            '{changelog:$changelog,changelogType:"markdown",displayName:("v"+$version),gameVersions:[$gv],releaseType:$reltype}' \
            > metadata.json

          echo "--- metadata.json ---"
          cat metadata.json
          echo ""
          echo "--- end metadata ---"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" \
            -F "metadata=<metadata.json" \
            -F "file=@v${VERSION}.zip" \
            "https://wow.curseforge.com/api/projects/1537185/upload-file")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "CurseForge upload failed — HTTP $HTTP_CODE"
            echo "Response body: $BODY"
            exit 1
          fi
          echo "Upload successful (HTTP $HTTP_CODE): $BODY"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.full_version }}
          name: v${{ steps.ver.outputs.full_version }}
          body_path: release_body.md
          prerelease: ${{ steps.rel.outputs.prerelease }}
          files: v${{ steps.ver.outputs.full_version }}.zip
